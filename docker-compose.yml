version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: sigo_cards_db
    environment:
      POSTGRES_USER: sigo_user
      POSTGRES_PASSWORD: sigo_password
      POSTGRES_DB: sigo_cards
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigo_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sigo_cards_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: sigo_cards_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://sigo_user:sigo_password@postgres:5432/sigo_cards
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_super_secret_key_change_in_production
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: sigo_cards_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000/api

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: sigo_cards_network
